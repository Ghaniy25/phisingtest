# Apache2 VirtualHost Configuration for Smart Phishing Detection System
# Reverse Proxy to FastAPI Backend and Static Frontend Host
# Location: /etc/apache2/sites-available/phishing-app.conf

<VirtualHost *:80>
    ServerName phishing-detector.local
    ServerAlias www.phishing-detector.local
    ServerAdmin webmaster@localhost

    # Frontend Single-Page Application Document Root
    DocumentRoot /var/www/html/phishing-app

    <Directory /var/www/html/phishing-app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Fallback to index.html for Single-Page Application routing
        FallbackResource /index.html
    </Directory>

    # Logging Configuration
    ErrorLog ${APACHE_LOG_DIR}/phishing_app_error.log
    CustomLog ${APACHE_LOG_DIR}/phishing_app_access.log combined

    # Proxy and Reverse Proxy Configuration for FastAPI Backend
    ProxyRequests Off
    ProxyPreserveHost On

    # Timeout and Connection Settings
    ProxyTimeout 60

    # Pass API calls directly to Uvicorn/FastAPI backend on port 8000
    <Location /api/v1/>
        ProxyPass http://127.0.0.1:8000/api/v1/
        ProxyPassReverse http://127.0.0.1:8000/api/v1/
        
        # Preserve original client IP and scheme headers
        RequestHeader set X-Forwarded-Proto "http"
        RequestHeader set X-Forwarded-Port "80"
    </Location>

    # Optional: Forward Swagger Docs if needed during development
    <Location /docs>
        ProxyPass http://127.0.0.1:8000/docs
        ProxyPassReverse http://127.0.0.1:8000/docs
    </Location>
    <Location /openapi.json>
        ProxyPass http://127.0.0.1:8000/openapi.json
        ProxyPassReverse http://127.0.0.1:8000/openapi.json
    </Location>

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>

