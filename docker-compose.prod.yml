services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: phisingtest-backend:latest
    container_name: phishing_detector_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - FIRESTORE_PROJECT_ID=${FIRESTORE_PROJECT_ID:-}
      - FIRESTORE_COLLECTION=${FIRESTORE_COLLECTION:-phishing_scans}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - RATE_LIMIT_ANALYZE=${RATE_LIMIT_ANALYZE:-30}
      - RATE_LIMIT_HISTORY=${RATE_LIMIT_HISTORY:-60}
    volumes:
      - phishing_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  phishing_data:
